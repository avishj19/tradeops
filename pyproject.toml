[project]
name = "tradeops"
version = "1.0.0"
description = "Local agentic trading-log analysis and optimization dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyarrow>=19,<26", "python-multipart>=0.0.20,<1", "boto3>=1.35,<2"]
[project.optional-dependencies]
benchmark = ["duckdb==1.5.5", "certifi>=2024"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
